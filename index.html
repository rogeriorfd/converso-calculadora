<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas Moderno</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        
        <!-- Bloco 1: A Calculadora -->
        <section class="calculator-card">
            <h1>Calculadora</h1>
            <input type="text" id="calc-display" readonly placeholder="0">
            <div class="calc-buttons">
                <button class="btn-clear">C</button>
                <button class="btn-op">/</button>
                <button class="btn-op">*</button>
                <button class="btn-op">-</button>
                
                <button class="btn-num">7</button>
                <button class="btn-num">8</button>
                <button class="btn-num">9</button>
                <button class="btn-op">+</button>
                
                <button class="btn-num">4</button>
                <button class="btn-num">5</button>
                <button class="btn-num">6</button>
                <button id="btn-equal">=</button>
                
                <button class="btn-num">1</button>
                <button class="btn-num">2</button>
                <button class="btn-num">3</button>
                <button class="btn-num">0</button>
            </div>
        </section>

        <!-- Bloco 2: O Conversor de Moedas -->
        <main class="converter-card">
            <h1>Conversor de Moedas</h1>
            <div class="input-group">
                <label for="amount">Valor em R$ (Real):</label>
                <input type="number" id="amount" placeholder="Ex: 100" min="0" step="0.01">
            </div>
            <button id="convert-btn">Converter para Dólar</button>
            <div class="result-container">
                <p id="result-text">Digite um valor para converter</p>
            </div>
        </main>

    </div>
</body>
</html>
